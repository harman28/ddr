<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vanshu's Vroom Vroom World</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Arial Black',Arial,sans-serif; }
canvas { display:block; }

#title-screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.5);
  pointer-events:all;
  z-index:10;
}
#title-main {
  font-size:clamp(40px,11vw,120px);
  color:#FFD700;
  text-shadow:5px 5px 0 #c00,-3px -3px 0 #900;
  text-align:center; line-height:1.1; letter-spacing:4px;
  animation:bump 1.2s ease-in-out infinite;
}
@keyframes bump { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
#title-sub {
  font-size:clamp(16px,3vw,30px); color:#fff;
  margin-top:24px; text-shadow:1px 1px 3px #000; text-align:center;
  animation:bump 1.2s ease-in-out infinite;
}

#mobile-controls {
  display:none; position:fixed; bottom:18px; left:0; right:0;
  justify-content:space-between; align-items:flex-end;
  padding:0 18px; pointer-events:all; z-index:5;
}
.steer-group { display:flex; gap:10px; }
.mbtn {
  width:72px; height:72px;
  background:rgba(255,255,255,0.2); border:2.5px solid rgba(255,255,255,0.6);
  border-radius:50%; font-size:28px; display:flex;
  align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none; touch-action:none; color:#fff;
}
#gear-track {
  width:72px; height:168px;
  background:rgba(0,0,0,0.4); border:2.5px solid rgba(255,255,255,0.4);
  border-radius:36px; position:relative; touch-action:none;
}
#gear-track::before { content:'CRUISE'; position:absolute; top:9px; left:50%;
  transform:translateX(-50%); font-size:8px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
#gear-track::after  { content:'GO'; position:absolute; bottom:9px; left:50%;
  transform:translateX(-50%); font-size:8px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
#gear-knob {
  width:62px; height:62px; position:absolute; bottom:8px; left:4px;
  background:rgba(220,40,40,0.85); border:2.5px solid rgba(255,120,120,0.9);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:28px; color:#fff; transition:bottom 0.15s,background 0.2s; pointer-events:none;
}
#gear-knob.cruise { bottom:calc(100% - 70px); background:rgba(20,200,60,0.9); border-color:rgba(100,255,150,0.95); }

#controls-hint {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.6); font-size:13px; text-align:center;
  text-shadow:1px 1px 2px #000; pointer-events:none; z-index:5;
}
@media (hover:none) and (pointer:coarse) {
  #mobile-controls { display:flex; }
  #controls-hint   { display:none; }
}
#coords {
  position:fixed; bottom:8px; left:12px;
  color:rgba(255,255,255,0.38); font-size:11px; font-family:monospace;
  text-shadow:1px 1px 2px #000; pointer-events:none; z-index:5;
}
#car-counter {
  position:fixed; top:14px; right:16px;
  color:#fff; font-size:22px; font-family:'Arial Black',Arial,sans-serif;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000;
  background:rgba(0,0,0,0.35); padding:5px 12px; border-radius:10px;
  pointer-events:none; z-index:5;
}
#success-screen {
  position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,180,80,0.82); z-index:20; pointer-events:all; cursor:pointer;
}
#success-main {
  font-size:clamp(36px,9vw,90px); color:#fff; text-align:center;
  font-family:'Arial Black',Arial,sans-serif;
  text-shadow:4px 4px 0 #004400; animation:bump 0.7s ease-in-out infinite;
}
#success-sub {
  font-size:clamp(18px,3vw,30px); color:#fff; margin-top:22px;
  font-family:Arial,sans-serif; text-shadow:1px 1px 3px #000;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title-screen">
  <div id="title-main">VANSHU'S<br>VROOM VROOM<br>WORLD</div>
  <div id="title-sub">Tap to start! &nbsp;|&nbsp; &#9650; or SPACE on keyboard</div>
</div>

<div id="mobile-controls">
  <div class="steer-group">
    <div class="mbtn" id="btn-left">&#9664;</div>
    <div class="mbtn" id="btn-right">&#9654;</div>
  </div>
  <div id="gear-track"><div id="gear-knob">&#9650;</div></div>
</div>
<div id="controls-hint">&#8593; Go &nbsp;|&nbsp; &#8595; Reverse &nbsp;|&nbsp; SPACE: Cruise &nbsp;|&nbsp; &#8592;&#8594;: Steer</div>
<div id="coords"></div>
<div id="car-counter">0/0</div>
<div id="success-screen">
  <div id="success-main">YOU GOT THEM ALL!</div>
  <div id="success-sub">Press &#9650; / SPACE / ESC &nbsp;|&nbsp; Tap to play again</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ─── RENDERER ───────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 220, 520);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 700);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ─── LIGHTING ───────────────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
sun.position.set(80, 160, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -300;
sun.shadow.camera.right = sun.shadow.camera.top = 300;
sun.shadow.camera.far = 900;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xb0d0ff, 0.75));

// ─── GROUND ─────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.MeshLambertMaterial({ color: 0x5cb85c })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// Large terrain zones — hand-placed so transitions feel gradual
const TERRAIN_ZONES = [
  { color: 0xc4a265, x:  220, z:  160, w: 320, h: 260, r: 0.3 },
  { color: 0xc4a265, x: -310, z:  210, w: 360, h: 290, r: 1.1 },
  { color: 0xc4a265, x:  -90, z: -420, w: 420, h: 310, r: 0.7 },
  { color: 0xd4b896, x:  420, z: -210, w: 260, h: 210, r: 0.5 },
  { color: 0xd4b896, x: -510, z: -110, w: 290, h: 230, r: 2.0 },
  { color: 0x888888, x:  110, z:  320, w: 160, h: 130, r: 0.2 },
  { color: 0x777777, x: -210, z: -310, w: 190, h: 150, r: 1.5 },
  { color: 0x3d8c3d, x:  360, z:  420, w: 410, h: 360, r: 0.4 },
  { color: 0x9b7b5b, x: -410, z:  360, w: 330, h: 270, r: 0.9 },
  { color: 0xb89a72, x:  510, z:  110, w: 290, h: 250, r: 1.3 },
  { color: 0x7a6040, x:    0, z:  520, w: 230, h: 190, r: 0.6 },
  { color: 0x7a6040, x: -310, z: -520, w: 270, h: 210, r: 0.3 },
  { color: 0xc8e6a0, x:  -80, z:  280, w: 200, h: 160, r: 1.8 },
  { color: 0x5aad4e, x:  600, z: -300, w: 350, h: 300, r: 0.8 },
];
TERRAIN_ZONES.forEach((t, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(t.w, t.h),
    new THREE.MeshLambertMaterial({ color: t.color }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = t.r;
  m.position.set(t.x, 0.01 + i * 0.002, t.z); scene.add(m);
});

// Road strips
const ROADS = [
  { x: 0,    z: 0,    dir: 0,          len: 700, w: 11 },
  { x: -80,  z: 300,  dir: Math.PI/4,  len: 450, w: 11 },
  { x: 300,  z: -100, dir: Math.PI/2,  len: 550, w: 11 },
  { x: -250, z: -200, dir: -Math.PI/6, len: 400, w: 11 },
];
for (const r of ROADS) {
  const road = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.len),
    new THREE.MeshLambertMaterial({ color: 0x555555 }));
  road.rotation.x = -Math.PI / 2; road.rotation.z = r.dir;
  road.position.set(r.x, 0.06, r.z); scene.add(road);
  // Centre line
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.4, r.len),
    new THREE.MeshLambertMaterial({ color: 0xffffaa }));
  line.rotation.x = -Math.PI / 2; line.rotation.z = r.dir;
  line.position.set(r.x, 0.08, r.z); scene.add(line);
}

// River ribbon
(function buildRiver() {
  const pts = [
    new THREE.Vector3(-900, 0, -400),
    new THREE.Vector3(-550, 0, -150),
    new THREE.Vector3(-220, 0,   60),
    new THREE.Vector3(  90, 0,  -90),
    new THREE.Vector3( 380, 0,  130),
    new THREE.Vector3( 680, 0,  350),
    new THREE.Vector3( 950, 0,  560),
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const W = 20, SEG = 120;
  const verts = [], uvs = [], idx = [];
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t).normalize();
    const rx = -tan.z, rz = tan.x;
    verts.push(p.x - rx*W/2, 0.055, p.z - rz*W/2,
               p.x + rx*W/2, 0.055, p.z + rz*W/2);
    uvs.push(0, t*30, 1, t*30);
    if (i < SEG) {
      const a=i*2, b=a+1, c=a+2, d=a+3;
      idx.push(a,b,c, b,d,c);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo,
    new THREE.MeshLambertMaterial({ color: 0x3a8fcf, transparent: true, opacity: 0.82 })));
})();

// Lake
// Lake — drive straight ahead ~260 units from spawn to find it
const lake = new THREE.Mesh(new THREE.CircleGeometry(90, 24),
  new THREE.MeshLambertMaterial({ color: 0x3a8fcf, transparent: true, opacity: 0.88 }));
lake.rotation.x = -Math.PI / 2; lake.position.set(0, 0.055, 260); scene.add(lake);
// Lake shore ring (slightly lighter)
const lakeShore = new THREE.Mesh(new THREE.RingGeometry(90, 105, 24),
  new THREE.MeshLambertMaterial({ color: 0xc8d8a0, side: THREE.DoubleSide }));
lakeShore.rotation.x = -Math.PI / 2; lakeShore.position.set(0, 0.035, 260); scene.add(lakeShore);

// Mountains on horizon
(function buildMountains() {
  const cols = [0x8899aa, 0x778899, 0x99aabb, 0x6677aa, 0xaabbcc];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const dist = 800 + Math.random() * 250;
    const h = 90 + Math.random() * 130;
    const r = 65 + Math.random() * 90;
    const col = cols[Math.floor(Math.random() * cols.length)];
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7),
      new THREE.MeshLambertMaterial({ color: col }));
    m.position.set(Math.cos(a)*dist, h/2, Math.sin(a)*dist);
    m.rotation.y = Math.random() * Math.PI; scene.add(m);
    const snow = new THREE.Mesh(new THREE.ConeGeometry(r*0.25, h*0.22, 7),
      new THREE.MeshLambertMaterial({ color: 0xffffff }));
    snow.position.set(Math.cos(a)*dist, h*0.91, Math.sin(a)*dist); scene.add(snow);
  }
})();

// ─── SUN DISK ───────────────────────────────────────────────────
const sunDisk = new THREE.Mesh(
  new THREE.SphereGeometry(22, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xfffde0 })
);
sunDisk.position.set(240, 420, 170); scene.add(sunDisk);

// ─── CLOUDS ─────────────────────────────────────────────────────
// Height 42-56: camera FOV math shows anything above ~55 units at 150 XZ is off screen.
// Use varied whites: bright on top, blue-gray shadow underneath — makes them 3-D and fluffy.
const clouds = [];
(function buildClouds() {
  // Top/highlight colours → mid → shadow belly colours
  const topCols    = [0xffffff, 0xfcfdff, 0xf8faff];
  const midCols    = [0xf0f4fc, 0xeef2fa, 0xe8eef8];
  const shadowCols = [0xd8e0f2, 0xccd4ec, 0xc4cce8];

  for (let i = 0; i < 24; i++) {
    const g = new THREE.Group();
    const n = 5 + Math.floor(Math.random() * 5);
    const sc = 1.1 + Math.random() * 1.5;
    for (let j = 0; j < n; j++) {
      const r = (5 + Math.random() * 9) * sc;
      const yOff = (Math.random()-0.5) * 5 * sc;
      // Pick colour tier by vertical position within cloud
      let palette = yOff > sc ? topCols : yOff > -sc ? midCols : shadowCols;
      const col = palette[Math.floor(Math.random() * palette.length)];
      const s = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5),
        new THREE.MeshBasicMaterial({ color: col }));
      s.position.set((Math.random()-0.5)*24*sc, yOff, (Math.random()-0.5)*13*sc);
      g.add(s);
    }
    const a = (i/24)*Math.PI*2 + Math.random()*0.28;
    const d = 85 + Math.random()*185;
    const cx = Math.cos(a)*d, cz = Math.sin(a)*d;
    const cy = 43 + Math.random()*13;
    g.position.set(cx, cy, cz);
    const spd = 1.5 + Math.random()*3.5;
    const dir = Math.random()*Math.PI*2;
    clouds.push({ group:g, cx, cz, cy, vx:Math.cos(dir)*spd, vz:Math.sin(dir)*spd });
    scene.add(g);
  }
})();

function updateClouds(dt, px, pz) {
  for (const c of clouds) {
    c.cx += c.vx * dt; c.cz += c.vz * dt;
    const dx = c.cx - px, dz = c.cz - pz;
    if (dx*dx + dz*dz > 350*350) {
      const a = Math.random()*Math.PI*2, d = 100+Math.random()*140;
      c.cx = px + Math.cos(a)*d; c.cz = pz + Math.sin(a)*d;
    }
    c.group.position.set(c.cx, c.cy, c.cz);
  }
}

// ─── CAR FACTORY ────────────────────────────────────────────────
function makeCar(color) {
  const g = new THREE.Group();
  const bodyMat  = new THREE.MeshLambertMaterial({ color });
  const darkMat  = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).multiplyScalar(0.55) });
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x99ccee, transparent: true, opacity: 0.75 });
  const tireMat  = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  const hubMat   = new THREE.MeshLambertMaterial({ color: 0xcccccc });
  const chromeMat= new THREE.MeshLambertMaterial({ color: 0xbbbbbb });

  // Main body — slightly wider at base than top for wedge feel
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.7, 4.6), bodyMat);
  body.position.y = 0.7; body.castShadow = true; g.add(body);

  // Hood slope — angled piece over front
  const hood = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.18, 1.3), bodyMat);
  hood.position.set(0, 1.18, 1.85); hood.rotation.x = 0.22; hood.castShadow = true; g.add(hood);

  // Cabin — set back slightly, tapered
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.68, 2.1), darkMat);
  cabin.position.set(0, 1.44, 0.18); cabin.castShadow = true; g.add(cabin);

  // Windshield
  const wf = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.58), glassMat);
  wf.position.set(0, 1.5, 1.38); wf.rotation.x = -0.32; g.add(wf);
  // Rear window
  const wr = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.5), glassMat);
  wr.position.set(0, 1.48, -0.92); wr.rotation.x = 0.32; g.add(wr);
  // Side windows
  for (const s of [-1, 1]) {
    const sw = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.42), glassMat);
    sw.position.set(s * 0.91, 1.52, 0.22); sw.rotation.y = s * Math.PI/2; g.add(sw);
  }

  // Trunk lip
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.16, 0.9), bodyMat);
  trunk.position.set(0, 1.16, -1.7); trunk.rotation.x = -0.2; g.add(trunk);

  // Front bumper
  const fBump = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.28, 0.22), chromeMat);
  fBump.position.set(0, 0.42, 2.38); g.add(fBump);
  // Rear bumper
  const rBump = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.28, 0.22), chromeMat);
  rBump.position.set(0, 0.42, -2.38); g.add(rBump);

  // Headlights
  const hlMat = new THREE.MeshLambertMaterial({ color: 0xffffcc, emissive: new THREE.Color(0.2,0.2,0) });
  for (const s of [-1, 1]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.22, 0.1), hlMat);
    hl.position.set(s * 0.8, 0.78, 2.33); g.add(hl);
  }
  // Tail lights
  const tlMat = new THREE.MeshLambertMaterial({ color: 0xff2200, emissive: new THREE.Color(0.25,0,0) });
  for (const s of [-1, 1]) {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.22, 0.1), tlMat);
    tl.position.set(s * 0.8, 0.78, -2.33); g.add(tl);
  }

  // Wheels — slightly larger, flared arches via side skirts
  const wGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.3, 14);
  for (const [wx, wy, wz] of [[-1.22,0.44,1.5],[1.22,0.44,1.5],[-1.22,0.44,-1.5],[1.22,0.44,-1.5]]) {
    const wheel = new THREE.Mesh(wGeo, tireMat); wheel.rotation.z = Math.PI/2;
    wheel.position.set(wx, wy, wz); wheel.castShadow = true; g.add(wheel);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.32,8), hubMat);
    hub.rotation.z = Math.PI/2; hub.position.set(wx, wy, wz); g.add(hub);
  }
  // Side skirts
  for (const s of [-1, 1]) {
    const skirt = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 3.8), darkMat);
    skirt.position.set(s * 1.18, 0.35, 0); g.add(skirt);
  }

  scene.add(g); return g;
}

// ─── PLAYER ─────────────────────────────────────────────────────
const player = { mesh: makeCar(0xff2020), wx: 0, wz: 0, heading: 0, speed: 0, maxSpeed: 30 };

// ─── WORLD OBJECT HELPERS ───────────────────────────────────────
const allWorldObjects = [];
// Terrain patches sit at y=0.01–0.038; lift all objects above them so nothing gets buried.
const GND_Y = 0.5;

function worldObj(group, wx, wz, type, opts) {
  group.position.set(wx, GND_Y, wz);
  scene.add(group);
  const o = Object.assign({
    group, wx, wz, type,
    vx:0, vz:0, vy:0, hopY:0, isHopping:false,
    activated:false, activationRadius:0, hopRadius:8,
  }, opts || {});
  return o;
}

// ─── TEXT SPRITE HELPER ─────────────────────────────────────────
function makeLabel(text) {
  const cv=document.createElement('canvas'); cv.width=220; cv.height=52;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,0.52)'; ctx.fillRect(0,0,220,52);
  ctx.fillStyle='#ffffff'; ctx.font='bold 26px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,110,27);
  const mat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false});
  const sp=new THREE.Sprite(mat); sp.scale.set(4,0.9,1); return sp;
}
function makeTextSprite(text, bg, fg) {
  const cv=document.createElement('canvas'); cv.width=256; cv.height=72;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=bg||'#003388'; ctx.fillRect(0,0,256,72);
  ctx.fillStyle=fg||'#ffffff'; ctx.font='bold 48px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,128,40);
  const mat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false});
  const sp=new THREE.Sprite(mat); sp.scale.set(5.5,1.6,1); return sp;
}

// ─── BILLBOARD ──────────────────────────────────────────────────
function makeBillboard(x, z) {
  const g = new THREE.Group();
  // Canvas texture — big colourful sign
  const cv = document.createElement('canvas'); cv.width=512; cv.height=256;
  const ctx = cv.getContext('2d');
  // Background gradient-ish (simulate with solid + border)
  ctx.fillStyle='#ffee44'; ctx.fillRect(0,0,512,256);
  ctx.fillStyle='#fffaaa'; ctx.fillRect(14,14,484,228);
  ctx.strokeStyle='#ee0077'; ctx.lineWidth=12; ctx.strokeRect(7,7,498,242);
  // Inner accent lines
  ctx.strokeStyle='#ff8800'; ctx.lineWidth=4; ctx.strokeRect(20,20,472,216);
  // Main text
  ctx.fillStyle='#dd0066'; ctx.font='bold 82px Arial Black, Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Hi Vanshu!', 256, 118);
  // Sub-text
  ctx.fillStyle='#ff8800'; ctx.font='bold 36px Arial';
  ctx.fillText('★  ★  ★  ★  ★', 256, 200);
  const tex = new THREE.CanvasTexture(cv);
  const signMat = new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide});

// ─── BOAT ────────────────────────────────────────────────────────
// Snap spawn point onto the nearest river centreline segment, return {cx,cz,dx,dz,segLen}
function snapToRiver(x, z) {
  let best = null, bestD = Infinity;
  for (let i = 0; i < _riverPts.length - 1; i++) {
    const [x1,z1] = _riverPts[i], [x2,z2] = _riverPts[i+1];
    const ex=x2-x1, ez=z2-z1, len=Math.sqrt(ex*ex+ez*ez);
    const t = Math.max(0, Math.min(1, ((x-x1)*ex+(z-z1)*ez)/(len*len)));
    const cx=x1+t*ex, cz=z1+t*ez;
    const d = Math.hypot(x-cx, z-cz);
    if (d < bestD) { bestD=d; best={cx,cz,dx:ex/len,dz:ez/len,segLen:len,t,i}; }
  }
  return best;
}

function makeBoat(x, z) {

  prow.rotation.z=Math.PI/2; prow.position.set(3.2,0.45,0); g.add(prow);

    new THREE.MeshLambertMaterial({color:0xc09060}));
  inner.position.y=0.95; g.add(inner);

  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,6,6), darkWoodMat);
  mast.position.set(-0.3,4,0); g.add(mast);

  sail.rotation.y=Math.PI/4; sail.position.set(-0.3,5,0); g.add(sail);

  // Snap onto river and drift along it
  const riv = snapToRiver(x, z);
  const driftRange = 18 + Math.random()*14;
  const o = worldObj(g, riv.cx, riv.cz, 'boat', {hopRadius:0, activationRadius:0,
    riverCX: riv.cx, riverCZ: riv.cz,
    riverDX: riv.dx, riverDZ: riv.dz,
    boatT:   (Math.random()-0.5) * driftRange * 2,
    boatDir: Math.random() < 0.5 ? 1 : -1,
    driftRange: driftRange,
    boatSpeed: 4 + Math.random()*3,
    bobFreq: 0.6+Math.random()*0.5,
  });
  o.group.position.y = 0.06;
  const lbl=makeLabel('BOAT'); lbl.position.set(0,8,0); g.add(lbl);
  return o;
}

function makeAmusementPark(x, z) {
  const g = new THREE.Group();

  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.55,14,8),
    new THREE.MeshLambertMaterial({color:0x888888}));
  pillar.position.y=7; pillar.castShadow=true; g.add(pillar);

  for (const s of [-1,1]) {
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.28,10,6),
      new THREE.MeshLambertMaterial({color:0x999999}));
    leg.position.set(s*4,5,0); leg.rotation.z=s*0.38; g.add(leg);
  }
  // Wheel ring — bigger, more spokes, more gondolas
  const ring = new THREE.Mesh(new THREE.TorusGeometry(7,0.28,8,36),
    new THREE.MeshLambertMaterial({color:0xff6600}));
  ring.position.y=13; g.add(ring);
  // Spokes
  for (let i=0;i<8;i++) {
    const a=(i/8)*Math.PI*2;
    const spoke=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,7,5),
      new THREE.MeshLambertMaterial({color:0xffaa44}));
    spoke.rotation.z=a; spoke.position.y=13; g.add(spoke);
  }
  // Gondolas
  const gondolaCols=[0xff3333,0x3399ff,0xffcc00,0x33cc33,0xff66cc,0xaaff44,0xff9900,0xcc44ff];
  const gondolas=[];
  for (let i=0;i<8;i++) {
    const gon=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.9),
      new THREE.MeshLambertMaterial({color:gondolaCols[i%gondolaCols.length]}));
    // Gondola suspension rod
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.7,4),
      new THREE.MeshLambertMaterial({color:0xcccccc}));
    const gonGroup=new THREE.Group(); gonGroup.add(gon); gonGroup.add(rod);
    rod.position.y=0.55;
    gon.userData.baseAngle=(i/8)*Math.PI*2;
    gonGroup.userData.baseAngle=(i/8)*Math.PI*2;
    g.add(gonGroup); gondolas.push(gonGroup);
  }
  function positionGondolas(a) {
    for (const gon of gondolas) {
      const ang=gon.userData.baseAngle+a;
      gon.position.set(Math.sin(ang)*7, 13+Math.cos(ang)*7, 0);
    }
  }
  positionGondolas(0);
  // Carousel
  const carBase=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,0.4,14),
    new THREE.MeshLambertMaterial({color:0xff99cc}));
  carBase.position.set(14,0.2,0); g.add(carBase);
  const carTop=new THREE.Mesh(new THREE.ConeGeometry(3.4,2.8,14),
    new THREE.MeshLambertMaterial({color:0xff55aa}));
  carTop.position.set(14,2.6,0); g.add(carTop);
  // Carousel horses (simple boxes)
  for (let i=0;i<6;i++) {
    const a=(i/6)*Math.PI*2;
    const horse=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.9,1.0),
      new THREE.MeshLambertMaterial({color:[0xffffff,0xffaaaa,0xaaaaff][i%3]}));
    horse.position.set(14+Math.sin(a)*2.2,0.6,Math.cos(a)*2.2);
    horse.userData.carAngle=a; horse.userData.isHorse=true; g.add(horse);
  }
  g.rotation.y=Math.random()*Math.PI*2;
  const o=worldObj(g,x,z,'amusementpark',{activationRadius:38,hopRadius:0});
  o.ring=ring; o.carTop=carTop; o.gondolas=gondolas;
  o.positionGondolas=positionGondolas; o.wheelAngle=0;
  o.horses=g.children.filter(c=>c.userData && c.userData.isHorse);
  const lbl=makeLabel('FUN PARK'); lbl.position.set(0,12,0); g.add(lbl);
  return o;
}

function makeRocket(x, z) {
  const g = new THREE.Group();
  const wm=new THREE.MeshLambertMaterial({color:0xffffff});
  const rm=new THREE.MeshLambertMaterial({color:0xff2200});
  const gm=new THREE.MeshLambertMaterial({color:0x888888});
  // Launch pad
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.8,0.5,12),gm);
  pad.position.y=0.25; g.add(pad);
  for (let i=0;i<4;i++) {
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.5,0.4),gm);
    const a=(i/4)*Math.PI*2;
    leg.position.set(Math.cos(a)*2.8,0.75,Math.sin(a)*2.8); g.add(leg);
  }
  // Support tower
  const tower=new THREE.Mesh(new THREE.BoxGeometry(0.5,14,0.5),gm);
  tower.position.set(2.8,7,0); g.add(tower);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.4,0.4),gm);
  arm.position.set(1.4,11,0); g.add(arm);
  // Rocket body group (everything that lifts off)
  const rk=new THREE.Group(); rk.position.y=0.5;
  // Body
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.0,7,12),wm);
  body.position.y=4; rk.add(body);
  // Nose cone
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.9,3.5,12),rm);
  nose.position.y=9; rk.add(nose);
  // Fins
  for (let i=0;i<4;i++) {
    const a=(i/4)*Math.PI*2;
    const fin=new THREE.Mesh(new THREE.BoxGeometry(0.15,2.4,1.6),rm);
    fin.position.set(Math.sin(a)*1.2,1.6,Math.cos(a)*1.2);
    fin.rotation.y=a; rk.add(fin);
  }
  // Windows
  for (const yp of [4.5,6,7.5]) {
    const win=new THREE.Mesh(new THREE.SphereGeometry(0.28,6,5),
      new THREE.MeshLambertMaterial({color:0x99ddff,transparent:true,opacity:0.85}));
    win.position.set(0.9,yp,0); rk.add(win);

// Load a WebP image, strip its white background via pixel processing,
// return a THREE.CanvasTexture that updates automatically on load.
function _makePigTex(imgSrc) {
  const cv = document.createElement('canvas'); cv.width=4; cv.height=4;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const img = new Image();
  img.onload = function() {
    cv.width = img.width; cv.height = img.height;
    ctx.drawImage(img, 0, 0);
    const id = ctx.getImageData(0, 0, cv.width, cv.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const r=d[i], g=d[i+1], b=d[i+2];
      const mn=Math.min(r,g,b), mx=Math.max(r,g,b);
      const bright=(r+g+b)/3, sat=mx-mn;
      if (bright>245 && sat<15) {
        d[i+3]=0;
      } else if (bright>210 && sat<40) {
        const t=(bright-210)/35, s=Math.min(1,sat/40);
        d[i+3]=Math.round((1-t*(1-s*0.6))*d[i+3]);
      }
    }
    ctx.putImageData(id, 0, 0);
    tex.needsUpdate = true;
  };
  img.src = imgSrc;
  return tex;
}

// ─── CHUNK SYSTEM ───────────────────────────────────────────────
const CHUNK_SIZE = 100;
const CHUNK_RADIUS = 3;
const activeChunks = new Map();

const OBJ_TYPES = [
  {fn:makeTree,   w:28}, {fn:makeHouse,  w:14}, {fn:makeBush,   w:18},
  {fn:makeCow,    w:8},  {fn:makeBird,   w:8},  {fn:makeClinic, w:2},
  {fn:makeAmusementPark,w:2}, {fn:makeConstruction,w:3},
  {fn:makePark,   w:5},  {fn:makeSchool, w:3},  {fn:makeRocket, w:2},
  {fn:makeDuck,   w:6},  {fn:makeRabbit, w:7},
  {fn:makeBillboard, w:3},
  {fn:makePeppa, w:2}, {fn:makeGeorge, w:1},
  {fn:makeMummyPig, w:1}, {fn:makeDaddyPig, w:1},
];
const OBJ_TOTAL = OBJ_TYPES.reduce((s,t)=>s+t.w, 0);

function pickObjFn() {
  let r = Math.random() * OBJ_TOTAL;
  for (const t of OBJ_TYPES) { r -= t.w; if (r <= 0) return t.fn; }
  return makeTree;
}

const _riverPts=[[-900,-400],[-550,-150],[-220,60],[90,-90],[380,130],[680,350],[950,560]];
function distToRiver(x,z){
  let d=Infinity;
  for(let i=0;i<_riverPts.length-1;i++){
    const [x1,z1]=_riverPts[i],[x2,z2]=_riverPts[i+1];
    const dx=x2-x1,dz=z2-z1,l2=dx*dx+dz*dz;
    const t=Math.max(0,Math.min(1,((x-x1)*dx+(z-z1)*dz)/l2));
    const nx=x1+t*dx-x,nz=z1+t*dz-z;
    const cd=Math.sqrt(nx*nx+nz*nz);
    if(cd<d)d=cd;
  }
  return d;
}
function distToRoad(x,z){
  let d=Infinity;
  for(const r of ROADS){
    const fx=Math.sin(r.dir),fz=Math.cos(r.dir);
    const dx=x-r.x,dz=z-r.z;
    const proj=dx*fx+dz*fz;
    if(Math.abs(proj)>r.len/2) continue;
    const cd=Math.abs(dx*fz-dz*fx);
    if(cd<d)d=cd;
  }
  return d;
}

function spawnChunk(cx, cz) {
  const objs = [];
  const n = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const x = cx * CHUNK_SIZE + 4 + Math.random() * (CHUNK_SIZE - 8);
    const z = cz * CHUNK_SIZE + 4 + Math.random() * (CHUNK_SIZE - 8);
    if (x*x + z*z < 18*18) continue;
    // Bias object type by proximity to river/road
    let fn;
    const rd=distToRiver(x,z), rRd=distToRoad(x,z);
    if (rd < 28 && Math.random() < 0.7) {
      const r2 = Math.random();
      fn = r2 < 0.45 ? makeHouse : r2 < 0.65 ? makeBush : r2 < 0.8 ? makeDuck : makeBoat;
    }
    else if (rRd < 15 && Math.random() < 0.65)
      fn = Math.random() < 0.75 ? makeTree : makeHouse;
    else
      fn = pickObjFn();
    const obj = fn(x, z);
    objs.push(obj); allWorldObjects.push(obj);
  }
  // Always place some Peppa family near the lake
  const LAKE_X=0, LAKE_Z=260, LAKE_R=82;
  const ccx = cx*CHUNK_SIZE + CHUNK_SIZE/2;
  const ccz = cz*CHUNK_SIZE + CHUNK_SIZE/2;
  const dLk = Math.sqrt((ccx-LAKE_X)**2 + (ccz-LAKE_Z)**2);
  if (dLk < LAKE_R + CHUNK_SIZE) {
    const pigFns = [makePeppa, makeGeorge, makeMummyPig, makeDaddyPig];
    const nPigs = 1 + Math.floor(Math.random()*2); // 1 or 2 per nearby chunk
    for (let p = 0; p < nPigs; p++) {
      const angle = Math.random()*Math.PI*2;
      const r = LAKE_R + 18 + Math.random()*45;
      const obj = pigFns[Math.floor(Math.random()*pigFns.length)](
        LAKE_X + Math.cos(angle)*r, LAKE_Z + Math.sin(angle)*r);
      objs.push(obj); allWorldObjects.push(obj);
    }
  }
  return objs;
}

function despawnChunk(key) {
  const objs = activeChunks.get(key);
  if (!objs) return;
  for (const o of objs) {
    scene.remove(o.group);
    const i = allWorldObjects.indexOf(o);
    if (i >= 0) allWorldObjects.splice(i, 1);
  }
}

function updateChunks(wx, wz) {
  const pcx = Math.floor(wx / CHUNK_SIZE);
  const pcz = Math.floor(wz / CHUNK_SIZE);
  const wanted = new Set();
  for (let dx = -CHUNK_RADIUS; dx <= CHUNK_RADIUS; dx++)
    for (let dz = -CHUNK_RADIUS; dz <= CHUNK_RADIUS; dz++)
      wanted.add(`${pcx+dx},${pcz+dz}`);
  for (const key of activeChunks.keys())
    if (!wanted.has(key)) { despawnChunk(key); activeChunks.delete(key); }
  for (const key of wanted)
    if (!activeChunks.has(key)) {
      const [cx,cz] = key.split(',').map(Number);
      activeChunks.set(key, spawnChunk(cx, cz));
    }
}

// ─── PROXIMITY & ZONE UPDATES ───────────────────────────────────
function updateWorldObjects(dt, px, pz) {
  const now = Date.now();
  for (const o of allWorldObjects) {
    const dx = px - o.wx, dz = pz - o.wz;
    const dist = Math.sqrt(dx*dx + dz*dz);

    // Hop trigger (trees, houses, bushes, pigs) — exaggerated comic leap
    if (o.hopRadius > 0 && dist < o.hopRadius && !o.isHopping) {
      const len = dist || 1;
      const force = 1.0 + (o.hopRadius - dist) / o.hopRadius;
      o.vx = -(dx/len) * 22 * force; o.vz = -(dz/len) * 22 * force; o.vy = 14 * force;
      o.spinV = (Math.random()-0.5) * 8;
      o.isHopping = true;
      if (o.type === 'pig') {
        // Oink! — two-tone squeal
        beep(380, 0.09, 'sine', 0.13);
        setTimeout(() => beep(260, 0.18, 'sine', 0.11), 100);
        if (o.bubble) { o.bubble.visible=true; o.bubbleTimer=2.6; }
      } else {
        beep(180 + Math.random()*180, 0.18, 'sine', 0.06);
      }
    }
    if (o.isHopping) {
      o.wx += o.vx * dt; o.wz += o.vz * dt;
      o.hopY = Math.max(0, o.hopY + o.vy * dt);
      o.vy -= 28 * dt;
      o.vx *= Math.pow(0.84, dt * 60); o.vz *= Math.pow(0.84, dt * 60);
      if (o.spinV) o.group.rotation.y += o.spinV * dt;
      if (o.hopY <= 0 && o.vy < 0) {
        o.hopY = 0;
        const spd = Math.abs(o.vx) + Math.abs(o.vz);
        if (spd > 1.2) { o.vy = spd * 0.45; if (o.spinV) o.spinV *= 0.5; }
        else { o.vy = 0; o.vx = 0; o.vz = 0; o.spinV = 0; o.isHopping = false; }
      }
      o.group.position.set(o.wx, o.hopY + GND_Y, o.wz);
    }

    // Cow flee — big panicked jump then sprint
    if (o.type === 'cow') {
      if (dist < o.hopRadius && !o.fleeing) {
        const len = dist || 1;
        o.fleeing = true;
        o.fleeVx = -(dx/len)*o.fleeSpeed; o.fleeVz = -(dz/len)*o.fleeSpeed;
        o.cowJumpY = 0; o.cowJumpV = 12; // big jump
        o.group.rotation.y = Math.atan2(-dx, -dz); // face away
      }
      if (o.fleeing) {
        o.wx += o.fleeVx * dt; o.wz += o.fleeVz * dt;
        o.fleeVx *= Math.pow(0.90, dt*60); o.fleeVz *= Math.pow(0.90, dt*60);
        o.cowJumpV = (o.cowJumpV||0) - 22*dt;
        o.cowJumpY = Math.max(0, (o.cowJumpY||0) + o.cowJumpV*dt);
        o.group.position.set(o.wx, o.cowJumpY + GND_Y, o.wz);
        if (Math.abs(o.fleeVx)+Math.abs(o.fleeVz) < 0.3) { o.fleeing=false; o.group.position.y=GND_Y; }
      }
    }

    // Bird fly-up — scatter with spin
    if (o.type === 'bird') {
      if (dist < o.hopRadius && !o.flyingUp) {
        const len = dist || 1;
        o.flyingUp = true; o.flyTimer = 3.0;
        o.flyVx = -(dx/len)*9+(Math.random()-0.5)*5;
        o.flyVy = 12+Math.random()*6;
        o.flyVz = -(dz/len)*9+(Math.random()-0.5)*5;
        o.group.rotation.y = Math.atan2(o.flyVx, o.flyVz);
      }
      if (o.flyingUp) {
        o.flyTimer -= dt; o.wx += o.flyVx*dt;
        o.hopY = Math.max(0, o.hopY + o.flyVy*dt); o.wz += o.flyVz*dt;
        o.flyVy -= 5 * dt;
        if (o.flyTimer <= 0 || o.hopY <= 0) { o.hopY = 0; o.flyingUp = false; }
        o.group.position.set(o.wx, o.hopY + GND_Y, o.wz);
      }
    }

    // Rocket — liftoff when player approaches
    if (o.type === 'rocket') {
      if (!o.launched && dist < o.activationRadius) {
        o.launched = true; o.launchVy = 1;
        o.flame.visible = true; o.innerFlame.visible = true;
        beep(60, 3.0, 'sawtooth', 0.08);
        setTimeout(() => beep(80, 2.0, 'sawtooth', 0.06), 500);
      }
      if (o.launched) {
        o.launchVy += 3.5 * dt;
        o.rocketY += o.launchVy * dt;
        o.rocket.position.y = o.rocketY;
        // Flame flicker
        const flicker = 0.85 + Math.random()*0.3;
        o.flame.scale.setScalar(flicker);
        o.innerFlame.scale.setScalar(flicker * 0.85);
        if (o.rocketY > 350) {
          // Rocket gone — reset after delay
          o.launched = false; o.rocketY = 0.5;
          o.rocket.position.y = 0.5;
          o.flame.visible = false; o.innerFlame.visible = false;
          o.activated = false;
        }
      }
    }

    // Rabbit — quick zigzag sprint away
    if (o.type === 'rabbit') {
      if (dist < o.hopRadius && !o.fleeing) {
        const len=dist||1;
        o.fleeing=true;
        const jitter=(Math.random()-0.5)*Math.PI*0.6;
        o.fleeVx=-(dx/len+Math.sin(jitter))*o.fleeSpeed;
        o.fleeVz=-(dz/len+Math.cos(jitter))*o.fleeSpeed;
        o.group.rotation.y=Math.atan2(-dx,-dz);
        beep(320+Math.random()*120, 0.12, 'sine', 0.05);
      }
      if (o.fleeing) {
        o.wx+=o.fleeVx*dt; o.wz+=o.fleeVz*dt;
        o.fleeVx*=Math.pow(0.88,dt*60); o.fleeVz*=Math.pow(0.88,dt*60);
        o.group.position.set(o.wx,GND_Y,o.wz);
        if (Math.abs(o.fleeVx)+Math.abs(o.fleeVz)<0.4) o.fleeing=false;
      }
    }

    // Pig — hide speech bubble after timer
    if (o.type === 'pig' && o.bubbleTimer > 0) {
      o.bubbleTimer -= dt;
      if (o.bubbleTimer <= 0) o.bubble.visible = false;
    }

    // River boats — drift up and down along river centreline, bounce at ends
    if (o.type === 'boat') {
      o.boatT += o.boatSpeed * o.boatDir * dt;
      if (Math.abs(o.boatT) >= o.driftRange) o.boatDir *= -1;
      o.wx = o.riverCX + o.riverDX * o.boatT;
      o.wz = o.riverCZ + o.riverDZ * o.boatT;
      const bob = Math.sin(now * 0.001 * o.bobFreq) * 0.07;
      o.group.position.set(o.wx, 0.06 + bob, o.wz);
      // Face along river direction (flip when reversing)
      o.group.rotation.y = Math.atan2(o.riverDX * o.boatDir, o.riverDZ * o.boatDir);
    }
    // Lake boats (sandwich + burger) — drift freely, bounce off shore
    if (o.type === 'sandwichboat' || o.type === 'burgerboat' || o.type === 'pastaboat') {
      o.wx += o.vx * dt;
      o.wz += o.vz * dt;
      const dlx = o.wx - o.lakeX, dlz = o.wz - o.lakeZ;
      const dl = Math.sqrt(dlx * dlx + dlz * dlz);
      if (dl > o.lakeR) {
        const nx = dlx / dl, nz = dlz / dl;
        const dot = o.vx * nx + o.vz * nz;
        if (dot > 0) { o.vx -= 2 * dot * nx; o.vz -= 2 * dot * nz; }
        o.wx = o.lakeX + nx * o.lakeR;
        o.wz = o.lakeZ + nz * o.lakeR;
      }
      const bob = Math.sin(now * 0.001 * o.bobFreq) * 0.07;
      o.group.position.set(o.wx, 0.06 + bob, o.wz);
      o.group.rotation.y = Math.atan2(o.vx, o.vz);
    }

    // Activation radius
    const wasActivated = o.activated;
    if (o.activationRadius > 0)
      o.activated = dist < o.activationRadius;

    // Zone animations
    if (o.type === 'clinic' && o.neonMat) {
      const t = o.activated ? 1 : 0;
      const flicker = o.activated ? (Math.sin(now*0.009)>0.75 ? 0.35 : 1) : 0;
      o.neonMat.emissive.setScalar(0.08 * flicker);
      o.neonMat.color.setRGB(0, t, t);
    }

    if (o.type === 'amusementpark' && o.ring) {
      if (o.activated) {
        o.wheelAngle += dt * 0.85;
        o.ring.rotation.z = o.wheelAngle;
        o.positionGondolas(o.wheelAngle);
        o.carTop.rotation.y += dt * 1.6;
        for (const h of (o.horses||[])) {
          h.userData.carAngle += dt * 1.6;
          h.position.set(
            o.group.position.x + (o.carTop.position.x - o.group.position.x) + Math.sin(h.userData.carAngle)*2.2,
            0.6,
            o.group.position.z + (o.carTop.position.z - o.group.position.z) + Math.cos(h.userData.carAngle)*2.2
          );
          // Simpler: move within group
          h.position.set(14+Math.sin(h.userData.carAngle)*2.2, 0.6, Math.cos(h.userData.carAngle)*2.2);
        }
      }
    }

    if (o.type === 'construction' && o.tractor && o.activated) {
      o.tractorAngle += dt * 0.45;
      o.tractor.position.set(Math.cos(o.tractorAngle)*10, 0, Math.sin(o.tractorAngle)*10);
      o.tractor.rotation.y = o.tractorAngle + Math.PI/2;
    }

    if (o.type === 'park' && o.swings && o.activated) {
      o.swingAngle += dt * 2.2;
      for (let i=0;i<o.swings.length;i++)
        o.swings[i].rotation.z = Math.sin(o.swingAngle + i*Math.PI) * 0.45;
    }

    if (o.type === 'school' && o.bell && o.activated) {
      o.bellAngle += dt * 9;
      o.bell.rotation.z = Math.sin(o.bellAngle) * 0.35;
      if (!wasActivated) beep(880, 0.4, 'sine', 0.08);
    }
  }
}

// Spawn new cars over time so the denominator keeps climbing
let newCarTimer = 20 + Math.random() * 15;
const newCarDefs = [
  {color:0x22cc44,type:'green',maxSpeed:22}, {color:0x2266ff,type:'blue',maxSpeed:28},
  {color:0xffffff,type:'white',maxSpeed:20}, {color:0xff8800,type:'orange',maxSpeed:26},
  {color:0xffee00,type:'yellow',maxSpeed:11},{color:0xff44cc,type:'green',maxSpeed:24},
  {color:0x44ffcc,type:'blue',maxSpeed:26},  {color:0xff6644,type:'orange',maxSpeed:28},
];
function maybeSpawnNewCar(dt, px, pz) {
  if (!gameStarted) return;
  newCarTimer -= dt;
  if (newCarTimer > 0) return;
  newCarTimer = 18 + Math.random() * 18;
  const def = newCarDefs[Math.floor(Math.random() * newCarDefs.length)];
  const a = Math.random()*Math.PI*2, d = 80 + Math.random()*80;
  const car = {
    ...def, mesh: makeCar(def.color),
    wx: px + Math.cos(a)*d, wz: pz + Math.sin(a)*d,
    heading: Math.random()*Math.PI*2, speed: 0,
    wanderTimer: 0, wanderHeading: Math.random()*Math.PI*2,
    exploding: false, explodeTimer: 0,
    orbitActive: false, orbitTimer: 0, orbitRadius: 20, orbitAngle: 0, orbitDir: 1,
  };
  car.mesh.position.set(car.wx, GND_Y, car.wz);
  aiCars.push(car);
  updateCarCounter();
}

const activeParticles = [];

function spawnExplosion(x, z) { // blue car: big fiery boom
  const cols=[0xff4400,0xffaa00,0xffff00,0xff6600,0xff2200];
  for (let i=0;i<18;i++) {
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.4+Math.random()*0.6,5,4),
      new THREE.MeshLambertMaterial({color:cols[Math.floor(Math.random()*cols.length)]}));
    const a=Math.random()*Math.PI*2, spd=8+Math.random()*16;
    m.position.set(x,0.5,z);
    m.userData.vx=Math.cos(a)*spd; m.userData.vy=4+Math.random()*12;
    m.userData.vz=Math.sin(a)*spd; m.userData.life=2.2;
    scene.add(m); activeParticles.push(m);
  }
}
function spawnGreenExplosion(x, z) { // green car: leafy pop puff
  const cols=[0x44ff44,0xaaff44,0x88ee22,0xffff44,0x22cc44];
  for (let i=0;i<12;i++) {
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.2+Math.random()*0.3,5,4),
      new THREE.MeshLambertMaterial({color:cols[Math.floor(Math.random()*cols.length)]}));
    const a=Math.random()*Math.PI*2, spd=5+Math.random()*10;
    m.position.set(x,0.5,z);
    m.userData.vx=Math.cos(a)*spd; m.userData.vy=6+Math.random()*8;
    m.userData.vz=Math.sin(a)*spd; m.userData.life=1.4;
    scene.add(m); activeParticles.push(m);
  }
}

function steerToward(car, tx, tz, turnRate, dt) {
  const target = Math.atan2(tx - car.wx, tz - car.wz);
  let dh = target - car.heading;
  while (dh >  Math.PI) dh -= Math.PI*2;
  while (dh < -Math.PI) dh += Math.PI*2;
  car.heading += Math.sign(dh) * Math.min(Math.abs(dh), turnRate * dt);
}

function respawnNearPlayer(car, px, pz, minDist, maxDist) {
  const a = Math.random()*Math.PI*2;
  const d = minDist + Math.random()*(maxDist-minDist);
  car.wx = px + Math.cos(a)*d; car.wz = pz + Math.sin(a)*d;
  car.speed = 0;
}

function updateAICars(dt, px, pz) {
  for (const car of aiCars) {
    if (car.exploding) {
      car.explodeTimer -= dt;
      if (car.explodeTimer <= 0) {
        respawnNearPlayer(car, px, pz, 80, 160);
        car.exploding = false; car.mesh.visible = true;
      }
      continue;
    }

    const dx = px - car.wx, dz = pz - car.wz;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if (car.type === 'green') {
      if (dist < 5) {
        car.exploding = true; car.explodeTimer = 2.8;
        car.mesh.visible = false;
        spawnGreenExplosion(car.wx, car.wz);
        beep(440, 0.15, 'sine', 0.12);
        setTimeout(() => beep(660, 0.12, 'sine', 0.08), 80);
        setTimeout(() => beep(880, 0.1, 'sine', 0.05), 150);
        onCarPopped(car);
      } else if (dist < 90) {
        steerToward(car, car.wx - dx, car.wz - dz, 2.2, dt); // away
        car.speed = Math.min(car.speed + 16*dt, car.maxSpeed);
      } else {
        car.wanderTimer -= dt;
        if (car.wanderTimer <= 0) { car.wanderHeading=Math.random()*Math.PI*2; car.wanderTimer=2+Math.random()*3; }
        steerToward(car, car.wx+Math.sin(car.wanderHeading)*10, car.wz+Math.cos(car.wanderHeading)*10, 1.5, dt);
        car.speed += (car.maxSpeed*0.35 - car.speed)*2*dt;
      }
      if (dist > 450) respawnNearPlayer(car, px, pz, 50, 100);

    } else if (car.type === 'blue') {
      if (dist < 280) {
        steerToward(car, px, pz, 2.8, dt);
        car.speed = Math.min(car.speed + 14*dt, car.maxSpeed);
        if (dist < 5) {
          car.exploding = true; car.explodeTimer = 3.2;
          car.mesh.visible = false;
          spawnExplosion(car.wx, car.wz);
          beep(90, 0.5, 'sawtooth', 0.12);
          setTimeout(() => beep(60, 0.6, 'sawtooth', 0.09), 80);
          onCarPopped(car);
        }
      } else {
        car.speed *= Math.pow(0.97, dt*60);
        respawnNearPlayer(car, px, pz, 70, 140);
      }

    } else if (car.type === 'white') {
      if (!car.orbitActive && dist < 70) {
        car.orbitActive = true; car.orbitTimer = 0;
        car.orbitRadius = 18 + Math.random()*10;
        car.orbitDir = Math.random() > 0.5 ? 1 : -1;
        car.orbitAngle = Math.atan2(car.wx - px, car.wz - pz);
      }
      if (car.orbitActive) {
        car.orbitTimer += dt;
        if (dist < 5 || car.orbitTimer > 20) {
          car.orbitActive = false;
          car.exploding = true; car.explodeTimer = 2.8;
          car.mesh.visible = false;
          spawnGreenExplosion(car.wx, car.wz);
          beep(550, 0.18, 'sine', 0.1);
          setTimeout(() => beep(330, 0.25, 'sine', 0.07), 100);
          if (dist < 5) { onCarPopped(car); }
        } else {
          car.speed = Math.min(car.speed + 9*dt, car.maxSpeed);
          const circ = (car.speed / Math.max(car.orbitRadius, 1));
          car.orbitAngle += car.orbitDir * circ * dt;
          const tx = px + Math.sin(car.orbitAngle)*car.orbitRadius;
          const tz = pz + Math.cos(car.orbitAngle)*car.orbitRadius;
          steerToward(car, tx, tz, 3.5, dt);
        }
      } else {
        if (dist < 5) {
          car.exploding = true; car.explodeTimer = 2.8;
          car.mesh.visible = false;
          spawnGreenExplosion(car.wx, car.wz);
          beep(550, 0.18, 'sine', 0.1);
          setTimeout(() => beep(330, 0.25, 'sine', 0.07), 100);
          onCarPopped(car);
        }
        car.wanderTimer -= dt;
        if (car.wanderTimer <= 0) { car.wanderHeading=Math.random()*Math.PI*2; car.wanderTimer=3+Math.random()*4; }
        steerToward(car, car.wx+Math.sin(car.wanderHeading)*10, car.wz+Math.cos(car.wanderHeading)*10, 1.2, dt);
        car.speed += (car.maxSpeed*0.28 - car.speed)*1.5*dt;
        if (dist > 450) respawnNearPlayer(car, px, pz, 60, 120);
      }

    } else if (car.type === 'orange') {
      if (dist < 5) {
        car.exploding = true; car.explodeTimer = 2.8;
        car.mesh.visible = false;
        spawnExplosion(car.wx, car.wz);
        beep(200, 0.3, 'sawtooth', 0.1);
        setTimeout(() => beep(140, 0.35, 'sawtooth', 0.08), 90);
        onCarPopped(car);
      }
      car.wanderTimer -= dt;
      if (car.wanderTimer <= 0) {
        car.wanderHeading = car.heading + (Math.random()-0.5)*Math.PI*1.8;
        car.wanderTimer = 0.35 + Math.random()*0.65;
      }
      steerToward(car, car.wx+Math.sin(car.wanderHeading)*20, car.wz+Math.cos(car.wanderHeading)*20, 3.2, dt);
      car.speed = Math.min(car.speed + 14*dt, car.maxSpeed);
      if (dist > 400) respawnNearPlayer(car, px, pz, 60, 120);

    } else if (car.type === 'yellow') {
      if (dist < 5) {
        car.exploding = true; car.explodeTimer = 2.5;
        car.mesh.visible = false;
        spawnGreenExplosion(car.wx, car.wz);
        beep(330, 0.2, 'sine', 0.09);
        setTimeout(() => beep(440, 0.15, 'sine', 0.06), 100);
        onCarPopped(car);
      }
      car.wanderTimer -= dt;
      if (car.wanderTimer <= 0) { car.wanderHeading=Math.random()*Math.PI*2; car.wanderTimer=5+Math.random()*7; }
      steerToward(car, car.wx+Math.sin(car.wanderHeading)*15, car.wz+Math.cos(car.wanderHeading)*15, 0.7, dt);
      car.speed += (car.maxSpeed*0.75 - car.speed)*0.9*dt;
      if (dist > 400) respawnNearPlayer(car, px, pz, 60, 120);
    }

    car.wx += Math.sin(car.heading)*car.speed*dt;
    car.wz += Math.cos(car.heading)*car.speed*dt;
    car.mesh.position.set(car.wx, GND_Y, car.wz);
    car.mesh.rotation.y = car.heading;
  }

  // Particles
  for (let i=activeParticles.length-1;i>=0;i--) {
    const p = activeParticles[i];
    p.userData.life -= dt;
    if (p.userData.life <= 0) { scene.remove(p); activeParticles.splice(i,1); continue; }
    p.userData.vy -= 16*dt;
    p.position.x += p.userData.vx*dt;
    p.position.y = Math.max(0, p.position.y + p.userData.vy*dt);
    p.position.z += p.userData.vz*dt;
    p.scale.setScalar(Math.max(0.1, p.userData.life*0.7));
  }
}

// ─── AUDIO ──────────────────────────────────────────────────────
let actx = null;
function getACtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
function beep(freq, dur, type='sine', vol=0.3) {
  try {
    const ac=getACtx(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  } catch(e){}
}
let engOsc=null, engFilter=null, engGain=null;
function startEngine() {
  try {
    const ac=getACtx();
    engOsc=ac.createOscillator(); engFilter=ac.createBiquadFilter(); engGain=ac.createGain();
    engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(ac.destination);
    engOsc.type='triangle'; engFilter.type='lowpass';
    engFilter.frequency.value=280; engGain.gain.value=0.04; engOsc.start();
  } catch(e){}
}
function updateEngine(speed, max) {
  if (!engOsc) return;
  const t = speed/max;
  engOsc.frequency.value = 55 + t*100;
  engGain.gain.value = 0.018 + t*0.038;
}

// ─── CONTROLS ───────────────────────────────────────────────────
const keys = { left:false, right:false, gas:false, reverse:false };
let cruise = false, gameStarted = false;

function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  document.getElementById('title-screen').style.display = 'none';
  getACtx(); startEngine();
}

// On mobile the title screen blocks all touches — tap anywhere on it to start
document.getElementById('title-screen').addEventListener('touchstart', e => {
  e.preventDefault();
  startGame();
  keys.gas = true;
}, {passive:false});
document.getElementById('title-screen').addEventListener('touchend', e => {
  e.preventDefault();
  keys.gas = false;
}, {passive:false});

document.addEventListener('keydown', e => {
  if (successPending) {
    if (e.code==='ArrowUp' || e.code==='Space' || e.code==='Escape') {
      e.preventDefault(); dismissSuccessScreen(); return;
    }
    return;
  }
  if (e.code==='ArrowLeft')  { keys.left=true; }
  if (e.code==='ArrowRight') { keys.right=true; }
  if (e.code==='ArrowUp')    { e.preventDefault(); keys.gas=true; startGame(); }
  if (e.code==='ArrowDown')  { e.preventDefault(); keys.reverse=true; if(cruise){cruise=false;keys.gas=false;} startGame(); }
  if (e.code==='Space')      {
    e.preventDefault();
    cruise = !cruise; keys.gas = cruise;
    startGame();
  }
  if (e.code==='Escape') {
    player.wx=0; player.wz=0; player.heading=0; player.speed=0;
    player.mesh.position.set(0,GND_Y,0); player.mesh.rotation.y=0;
    cruise=false; keys.gas=false; keys.left=false; keys.right=false; keys.reverse=false;
    gearKnobEl.classList.remove('cruise'); gearKnobEl.textContent='▲';
    camera.position.set(0,7.5,-16);
    carsPopped=0; updateCarCounter();
    gameStarted=false;
    document.getElementById('title-screen').style.display='';
  }
});
document.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft')  keys.left=false;
  if (e.code==='ArrowRight') keys.right=false;
  if (e.code==='ArrowUp' && !cruise) keys.gas=false;
  if (e.code==='ArrowDown') keys.reverse=false;
});

// Gear stick
const gearTrackEl = document.getElementById('gear-track');
const gearKnobEl  = document.getElementById('gear-knob');
let gearStartY=0, gearCruiseThisTouch=false;

gearTrackEl.addEventListener('touchstart', e=>{
  e.preventDefault(); gearStartY=e.touches[0].clientY; gearCruiseThisTouch=false;
  if (!cruise) keys.gas=true;
  startGame(); getACtx();
}, {passive:false});
gearTrackEl.addEventListener('touchmove', e=>{
  e.preventDefault();
  if (gearStartY - e.touches[0].clientY > 38 && !cruise) {
    cruise=true; gearCruiseThisTouch=true; keys.gas=true;
    gearKnobEl.classList.add('cruise'); gearKnobEl.textContent='∞';
  }
}, {passive:false});
gearTrackEl.addEventListener('touchend', e=>{
  e.preventDefault();
  if (gearCruiseThisTouch) return;
  if (cruise) { cruise=false; keys.gas=false; gearKnobEl.classList.remove('cruise'); gearKnobEl.textContent='▲'; }
  else keys.gas=false;
}, {passive:false});

// ─── CAMERA ─────────────────────────────────────────────────────
camera.position.set(0, 7, -14);

function updateCamera(wx, wz, heading, dt) {
  const dist=16, h=7.5;
  const tx = wx - Math.sin(heading)*dist;
  const tz = wz - Math.cos(heading)*dist;
  const s = Math.min(dt*9, 1);
  camera.position.x += (tx - camera.position.x)*s;
  camera.position.y += (h  - camera.position.y)*s;
  camera.position.z += (tz - camera.position.z)*s;
  camera.lookAt(wx + Math.sin(heading)*6, 1.2, wz + Math.cos(heading)*6);
}

// ─── PLANE ──────────────────────────────────────────────────────
// Custom geometry helpers — all in plane-local space (nose = +Z, right wing = +X)
function makeSweepWingGeo(span, rootChord, tipChord, sweepDeg, thick) {
  const sw = span * Math.tan(sweepDeg * Math.PI/180);
  const h = thick/2;
  const rLE=rootChord/2, rTE=-rootChord/2;
  const tLE=tipChord/2-sw, tTE=-tipChord/2-sw;
  const v=new Float32Array([
    0,h,rLE, 0,h,rTE, span,h,tTE, span,h,tLE,
    0,-h,rLE, 0,-h,rTE, span,-h,tTE, span,-h,tLE,
  ]);
  const idx=[0,3,2, 0,2,1, 4,5,6, 4,6,7,
             0,1,5, 0,5,4, 3,7,6, 3,6,2,
             0,4,7, 0,7,3, 1,2,6, 1,6,5];
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.setIndex(idx); geo.computeVertexNormals(); return geo;
}
function makeFinGeo(height, rootChord, tipChord, sweepDeg) {
  const sw=height*Math.tan(sweepDeg*Math.PI/180), h=0.14;
  const rLE=rootChord/2, rTE=-rootChord/2;
  const tLE=tipChord/2-sw, tTE=-tipChord/2-sw;
  const v=new Float32Array([
    h,0,rLE, h,0,rTE, h,height,tTE, h,height,tLE,
    -h,0,rLE, -h,0,rTE, -h,height,tTE, -h,height,tLE,
  ]);
  const idx=[0,1,2, 0,2,3, 4,6,5, 4,7,6,
             0,3,7, 0,7,4, 1,5,6, 1,6,2,
             0,4,5, 0,5,1, 3,2,6, 3,6,7];
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.setIndex(idx); geo.computeVertexNormals(); return geo;
}

// Plane mesh — all parts built facing +Z (nose forward), wings spanning ±X
function makePlaneMesh() {
  const out=new THREE.Group(); // world-placed group
  const g=new THREE.Group();   // inner group scaled
  out.add(g);

  const white=new THREE.MeshLambertMaterial({color:0xeef4ff});
  const blue =new THREE.MeshLambertMaterial({color:0x0044cc});
  const gray =new THREE.MeshLambertMaterial({color:0x8899aa});
  const dkgray=new THREE.MeshLambertMaterial({color:0x334455});
  const glass=new THREE.MeshLambertMaterial({color:0x88ccff,transparent:true,opacity:0.6});
  const tire =new THREE.MeshLambertMaterial({color:0x111111});
  const strut=new THREE.MeshLambertMaterial({color:0xaabbcc});

  // ── Fuselage ──
  // Main tube: along Z axis via rotation.x=-π/2
  const fus=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.9,12,14),white);
  fus.rotation.x=-Math.PI/2; g.add(fus);
  // Nose cone (tip at +Z): rotate.x = π/2 puts tip at -Z → use -π/2 for tip at +Z
  const noseCone=new THREE.Mesh(new THREE.ConeGeometry(1.0,3.5,14),white);
  noseCone.rotation.x=-Math.PI/2; noseCone.position.z=7.75; g.add(noseCone);
  // Tail cone (tip at -Z): rotate.x = +π/2 points tip to -Z
  const tailCone=new THREE.Mesh(new THREE.ConeGeometry(0.9,3.5,14),white);
  tailCone.rotation.x=Math.PI/2; tailCone.position.z=-7.75; g.add(tailCone);
  // Blue livery stripe (slightly wider radius, at rear cabin)
  const stripe=new THREE.Mesh(new THREE.CylinderGeometry(1.015,1.015,2.8,14),blue);
  stripe.rotation.x=-Math.PI/2; stripe.position.z=-2.2; g.add(stripe);
  // Cockpit windows (glass panel on nose upper side)
  const wnds=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.48,3.6),glass);
  wnds.position.set(0,0.88,5.0); wnds.rotation.x=-0.18; g.add(wnds);

  // ── Wings (right: +X half, left: mirror -X) ──
  const wingGeo=makeSweepWingGeo(9.5,3.8,1.5,26,0.22);
  const rWing=new THREE.Mesh(wingGeo,white); rWing.position.set(0,-0.28,0); g.add(rWing);
  const lWing=new THREE.Mesh(wingGeo,white); lWing.position.set(0,-0.28,0);
  lWing.scale.x=-1; g.add(lWing);

  // ── Engines (under wings at ~40% span) ──
  for (const sx of [-1,1]) {
    const ex=sx*4.0, ez=-0.8, ey=-1.45;
    const nac=new THREE.Mesh(new THREE.CylinderGeometry(0.54,0.48,4.0,12),gray);
    nac.rotation.x=-Math.PI/2; nac.position.set(ex,ey,ez); g.add(nac);
    const intake=new THREE.Mesh(new THREE.TorusGeometry(0.54,0.1,8,12),dkgray);
    intake.rotation.x=-Math.PI/2; intake.position.set(ex,ey,ez+2.0); g.add(intake);
    const nozzle=new THREE.Mesh(new THREE.TorusGeometry(0.44,0.08,8,12),dkgray);
    nozzle.rotation.x=-Math.PI/2; nozzle.position.set(ex,ey,ez-2.0); g.add(nozzle);
    const pylon=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.85,1.6),gray);
    pylon.position.set(ex,-0.85,ez); g.add(pylon);
  }

  // ── Tail assembly ──
  const finGeo=makeFinGeo(3.5,2.4,0.9,40);
  const vFin=new THREE.Mesh(finGeo,white); vFin.position.set(0,0.88,-6.2); g.add(vFin);
  const stabGeo=makeSweepWingGeo(3.6,1.8,0.7,24,0.14);
  const rStab=new THREE.Mesh(stabGeo,white); rStab.position.set(0,0.5,-7.0); g.add(rStab);
  const lStab=new THREE.Mesh(stabGeo,white); lStab.position.set(0,0.5,-7.0);
  lStab.scale.x=-1; g.add(lStab);

  // ── Landing gear ──
  const gearGroup=new THREE.Group(); g.add(gearGroup);
  // Nose gear strut + 2 wheels
  const nStrut=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.2,6),strut);
  nStrut.position.set(0,-1.55,4.8); gearGroup.add(nStrut);
  for (const sz of [-0.28,0.28]) {
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.2,10),tire);
    w.rotation.x=Math.PI/2; w.position.set(0,-2.18,4.8+sz); gearGroup.add(w);
  }
  // Main gear (two sets under wings)
  for (const sx of [-1,1]) {
    const mStrut=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.2,6),strut);
    mStrut.position.set(sx*3.5,-1.55,-0.8); gearGroup.add(mStrut);
    for (const sz of [-0.4,0.0,0.4]) {
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.22,10),tire);
      w.rotation.x=Math.PI/2; w.position.set(sx*3.5,-2.2,-0.8+sz); gearGroup.add(w);
    }
  }

  g.scale.set(1.7,1.7,1.7);
  scene.add(out);
  return { mesh:out, gear:gearGroup };
}

// Airport key positions
const _AX=AIRPORT.x, _AZ=AIRPORT.z, _AL=AIRPORT.len;
const _TKOFF_Z = _AZ - _AL/2 + 40;   // south threshold + buffer
const _TDOWN_Z = _AZ + _AL/2 - 40;   // north threshold - buffer
const _APFX_Z  = _AZ + _AL/2 + 650;  // approach fix: 650 units north of runway

function _setHeadingToward(p, tx, tz, turnRate, dt) {
  const want = Math.atan2(tx - p.wx, tz - p.wz);
  let dh = want - p.heading;
  while (dh >  Math.PI) dh -= Math.PI*2;
  while (dh < -Math.PI) dh += Math.PI*2;
  p.heading += Math.sign(dh) * Math.min(Math.abs(dh), turnRate * dt);
}

function updateOnePlane(p, dt) {
  if (p.state==='waiting') {
    p.waitTimer -= dt;
    if (p.waitTimer <= 0) {
      // Position at south threshold of airport runway, heading north
      p.wx=_AX; p.wz=_TKOFF_Z; p.wy=GND_Y+1.8;
      p.heading=0; p.speed=0; p.bounced=false;
      p.gear.visible=true;
      p.mesh.visible=true;
      p.mesh.rotation.set(0,0,0);
      p.state='taxiing';
    }

  } else if (p.state==='taxiing') {
    // Accelerate down runway heading north (+Z)
    p.speed = Math.min(p.speed + 9*dt, 30);
    p.wz += p.speed * dt;              // heading=0, cos(0)=1 → moves in +Z
    p.mesh.position.set(p.wx, p.wy, p.wz);
    p.mesh.rotation.set(0, 0, 0);      // facing +Z, level
    // Rotate engine sound-like visual: slight pitch oscillation at low speed
    if (p.speed >= 27) p.state='climbing';

  } else if (p.state==='climbing') {
    p.speed = Math.min(p.speed + 5*dt, 55);
    p.wy += 15 * dt;
    p.wz += p.speed * dt;              // still heading north
    if (p.wy >= 22) { p.gear.visible=false; } // gear retract
    p.mesh.position.set(p.wx, p.wy, p.wz);
    // nose-up pitch (rotation.x negative = nose up in this orientation)
    p.mesh.rotation.set(-0.28, 0, 0);
    if (p.wy >= 65) {
      p.wy = 65;
      p.flyTimer = 38 + Math.random() * 18;
      p.state='flying';
    }

  } else if (p.state==='flying') {
    // Gentle right-hand circle (heading decreases slowly), wide radius
    p.heading -= 0.10 * dt;
    p.wx += Math.sin(p.heading) * p.speed * dt;
    p.wz += Math.cos(p.heading) * p.speed * dt;
    p.mesh.position.set(p.wx, p.wy, p.wz);
    // Gentle right bank: rotation.z positive = left wing up = right bank
    p.mesh.rotation.set(0, p.heading, 0.14);
    p.flyTimer -= dt;
    if (p.flyTimer <= 0) p.state='approaching';

  } else if (p.state==='approaching') {
    // Phase 1: navigate to approach fix far north of runway
    const toFixX = _AX - p.wx, toFixZ = _APFX_Z - p.wz;
    const distFix = Math.sqrt(toFixX*toFixX + toFixZ*toFixZ);
    if (distFix > 120) {
      _setHeadingToward(p, _AX, _APFX_Z, 1.4, dt);
    } else {
      // Phase 2: locked onto final approach heading south (Math.PI)
      let dh = Math.PI - p.heading;
      while (dh >  Math.PI) dh -= Math.PI*2;
      while (dh < -Math.PI) dh += Math.PI*2;
      p.heading += Math.sign(dh) * Math.min(Math.abs(dh), 2.0*dt);
    }
    p.wx += Math.sin(p.heading) * p.speed * dt;
    p.wz += Math.cos(p.heading) * p.speed * dt;
    // Begin descending once south of approach fix (heading generally south)
    if (p.wz < _APFX_Z - 80 && p.wy > GND_Y + 2) {
      const descentRate = Math.min(14, (p.wy - GND_Y - 2) * 0.08 + 4);
      p.wy = Math.max(GND_Y + 1.8, p.wy - descentRate * dt);
    }
    if (p.wy < 30 && !p.gear.visible) p.gear.visible = true; // extend gear
    p.mesh.position.set(p.wx, p.wy, p.wz);
    const pitch = p.wy > GND_Y+10 ? 0.1 : 0.04; // nose slightly down on descent
    p.mesh.rotation.set(pitch, p.heading, 0);
    // Switch to landing when aligned south, near touchdown zone, and low
    const onGlidepath = Math.abs(p.heading - Math.PI) < 0.25;
    const nearThreshold = p.wz < _TDOWN_Z + 100 && p.wz > _TDOWN_Z - 300;
    if (onGlidepath && nearThreshold && p.wy < 14) {
      p.heading = Math.PI; // snap to runway heading
      p.state = 'landing';
    }

  } else if (p.state==='landing') {
    p.speed = Math.max(p.speed - 20*dt, 0);
    p.wy = Math.max(p.wy - 16*dt, GND_Y + 1.8);
    p.wz += Math.cos(p.heading) * p.speed * dt; // heading π → cos(π)=-1 → moves south
    p.mesh.position.set(p.wx, p.wy, p.wz);
    // Flare: level off pitch as we near ground
    const flare = p.wy < GND_Y + 6 ? -0.06 : 0.04;
    p.mesh.rotation.set(flare, p.heading, 0);
    if (p.wy <= GND_Y + 1.8 && !p.bounced) {
      p.bounced = true;
      beep(130, 0.35, 'sine', 0.14); // touchdown thump
    }
    if (p.wy <= GND_Y + 1.8 && p.speed < 0.5) {
      p.wy = GND_Y + 1.8;
      p.mesh.rotation.set(0, p.heading, 0);
      p.state = 'rollout';
      p.waitTimer = 6 + Math.random()*6;
    }

  } else if (p.state==='rollout') {
    p.waitTimer -= dt;
    if (p.waitTimer <= 0) {
      p.mesh.visible = false;
      p.state = 'waiting';
      p.waitTimer = 12 + Math.random()*16;
    }
  }
}

function updatePlanes(dt, px, pz) {
  for (const p of planes) updateOnePlane(p, dt);
}

// ─── CAR TRACKS ─────────────────────────────────────────────────
const TRACK_INTERVAL = 0.13, TRACK_LIFE = 9, TRACK_MAX = 200;
const trackMeshes = [];
let trackHead = 0, trackTimer = 0;
{
  const geo = new THREE.PlaneGeometry(0.24, 1.6);
  for (let i = 0; i < TRACK_MAX; i++) {
    const m = new THREE.Mesh(geo,
      new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0, depthWrite: false }));
    m.position.y = 0.07; m.visible = false; m.userData.life = 0;
    scene.add(m); trackMeshes.push(m);
  }
}
function stampTrack(wx, wz, heading) {
  const fwdX = Math.sin(heading), fwdZ = Math.cos(heading);
  const rgtX = Math.cos(heading), rgtZ = -Math.sin(heading);
  // 4 wheel positions: front-left, front-right, rear-left, rear-right
  const wheels = [
    [fwdX*1.5 - rgtX*1.2, fwdZ*1.5 - rgtZ*1.2],
    [fwdX*1.5 + rgtX*1.2, fwdZ*1.5 + rgtZ*1.2],
    [-fwdX*1.5 - rgtX*1.2, -fwdZ*1.5 - rgtZ*1.2],
    [-fwdX*1.5 + rgtX*1.2, -fwdZ*1.5 + rgtZ*1.2],
  ];
  for (const [ox, oz] of wheels) {
    const m = trackMeshes[trackHead % TRACK_MAX]; trackHead++;
    m.position.set(wx + ox, 0.07, wz + oz);
    m.rotation.set(-Math.PI/2, 0, heading); // rotation.z around local Z = world Y ✓
    m.material.opacity = 0.55;
    m.userData.life = TRACK_LIFE; m.visible = true;
  }
}
function updateTracks(dt, wx, wz, heading, speed) {
  if (speed > 1) {
    trackTimer -= dt;
    if (trackTimer <= 0) { stampTrack(wx, wz, heading); trackTimer = TRACK_INTERVAL; }
  }
  for (const m of trackMeshes) {
    if (!m.visible) continue;
    m.userData.life -= dt;
    if (m.userData.life <= 0) { m.visible = false; m.material.opacity = 0; }
    else m.material.opacity = (m.userData.life / TRACK_LIFE) * 0.55;
  }
}

// ─── LAKE BOAT COLLISION ────────────────────────────────────────
function updateLakeBoatCollision() {
  for (let i = 0; i < lakeBoats.length; i++) {
    for (let j = i + 1; j < lakeBoats.length; j++) {
      const a = lakeBoats[i], b = lakeBoats[j];
      const dx = b.wx - a.wx, dz = b.wz - a.wz;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const minDist = (a.boatRadius || 5) + (b.boatRadius || 5);
      if (dist < minDist && dist > 0.001) {
        const nx = dx / dist, nz = dz / dist;
        const relVx = a.vx - b.vx, relVz = a.vz - b.vz;
        const dot = relVx * nx + relVz * nz;
        if (dot > 0) {
          a.vx -= dot * nx; a.vz -= dot * nz;
          b.vx += dot * nx; b.vz += dot * nz;
        }
        const overlap = (minDist - dist) * 0.5;
        a.wx -= nx * overlap; a.wz -= nz * overlap;
        b.wx += nx * overlap; b.wz += nz * overlap;
      }
    }
  }
}

// ─── UPDATE ─────────────────────────────────────────────────────
const ACCEL=22, BRAKE=32, STEER=1.7;

function update(dt) {
  if (!gameStarted) return;

  // Player
  if (keys.gas)          player.speed = Math.min(player.speed + ACCEL*dt, player.maxSpeed);
  else if (keys.reverse) player.speed = Math.max(player.speed - ACCEL*dt, -player.maxSpeed*0.4);
  else if (player.speed > 0) player.speed = Math.max(player.speed - BRAKE*0.32*dt, 0);
  else if (player.speed < 0) player.speed = Math.min(player.speed + BRAKE*0.32*dt, 0);

  const si = (keys.right?-1:0)+(keys.left?1:0);
  player.heading += si * STEER * dt;
  player.wx += Math.sin(player.heading)*player.speed*dt;
  player.wz += Math.cos(player.heading)*player.speed*dt;
  player.mesh.position.set(player.wx, GND_Y, player.wz);
  player.mesh.rotation.y = player.heading;

  updateChunks(player.wx, player.wz);
  updateWorldObjects(dt, player.wx, player.wz);
  updateLakeBoatCollision();
  updateAICars(dt, player.wx, player.wz);
  maybeSpawnNewCar(dt, player.wx, player.wz);
  updateCamera(player.wx, player.wz, player.heading, dt);
  updateClouds(dt, player.wx, player.wz);
  updatePlanes(dt, player.wx, player.wz);
  updateTracks(dt, player.wx, player.wz, player.heading, player.speed);
  updateEngine(player.speed, player.maxSpeed);
}

// ─── LOOP ───────────────────────────────────────────────────────
let last=0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  document.getElementById('coords').textContent = `x:${Math.round(player.wx)} z:${Math.round(player.wz)}`;
}
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
</script>
